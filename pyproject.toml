[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arch-modular-saas-django"
version = "0.1.0"
description = "Multi-tenant SaaS backend with Django modular monolith architecture"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Your Name", email = "your@email.com" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: Django :: 5.1",
    "Typing :: Typed",
]

dependencies = [
    # Django core
    "django>=5.1",
    "djangorestframework>=3.15",
    
    # Authentication & OAuth
    "django-allauth[socialaccount]>=65.0",
    "dj-rest-auth>=7.0",
    
    # Database
    "psycopg[binary]>=3.2",
    
    # Cache & Sessions
    "django-redis>=5.4",
    
    # Configuration
    "pydantic-settings>=2.5",
    
    # Billing (optional - works without Stripe)
    "stripe>=11.0",
    "python-dateutil>=2.9",
    
    # Email (optional - works without Resend)
    "resend>=2.4",
    
    # Storage (optional - S3 compatible)
    "django-storages>=1.14",
    "boto3>=1.35",
    
    # Utilities
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    
    # API & filtering
    "django-cors-headers>=4.4",
    "django-filter>=24.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "factory-boy>=3.3",
    "faker>=30.0",
    "testcontainers>=4.8",
    
    # Code quality
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    
    # Security
    "bandit>=1.7",
    "pip-audit>=2.7",
    
    # Development
    "ipython>=8.29",
    "django-extensions>=3.2",
    "django-debug-toolbar>=4.4",
    "pre-commit>=3.8.0",
    
    # API documentation
    "drf-spectacular>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

# ==================================================
# RUFF
# ==================================================
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH",
    "ANN", "N", "A", "DTZ", "EM", "PIE", "RET", "SLF",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "ARG", "PLR2004"]
"**/__init__.py" = ["F401"]
"**/migrations/*.py" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ==================================================
# MYPY
# ==================================================
[tool.mypy]
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
# Use selective strictness instead of full strict mode
warn_return_any = true
show_error_codes = true
no_implicit_optional = true
warn_unreachable = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["*.admin"]
disallow_untyped_defs = false
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = [
    "apps.tenants.signals",
    "apps.members.signals",
    "apps.billing.signals",
    "apps.authentication.signals",
    "apps.features.signals",
]
disallow_untyped_defs = false
disable_error_code = ["no-any-return", "arg-type"]

[[tool.mypy.overrides]]
module = ["apps.shared.management.commands.*"]
disallow_untyped_defs = false
disable_error_code = ["arg-type", "attr-defined", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
    "apps.tenants.serializers",
    "apps.members.serializers",
    "apps.billing.serializers",
    "apps.authentication.serializers",
    "apps.features.serializers",
]
disable_error_code = ["type-arg", "no-any-return", "assignment"]

[[tool.mypy.overrides]]
module = [
    "apps.tenants.models",
    "apps.members.models",
    "apps.billing.models",
    "apps.authentication.models",
    "apps.features.models",
]
disallow_untyped_defs = false
disable_error_code = ["type-arg", "misc", "no-any-return"]

[[tool.mypy.overrides]]
module = [
    "apps.tenants.services",
    "apps.members.services",
    "apps.billing.services",
    "apps.authentication.services",
    "apps.features.services",
    "apps.shared.services",
]
disable_error_code = ["no-any-return", "attr-defined", "misc", "import-untyped", "type-arg", "assignment"]

[[tool.mypy.overrides]]
module = [
    "apps.tenants.views",
    "apps.members.views",
    "apps.billing.views",
    "apps.authentication.views",
    "apps.features.views",
]
disallow_untyped_defs = false
disable_error_code = ["type-arg", "arg-type", "misc", "assignment", "no-untyped-call"]

[[tool.mypy.overrides]]
module = ["apps.shared.exception_handler"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["apps.shared.urls"]
disallow_untyped_defs = false
disable_error_code = ["index"]

[[tool.mypy.overrides]]
module = ["apps.shared.email"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["apps.shared.middleware"]
disable_error_code = ["misc"]

# ==================================================
# PYTEST
# ==================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require testcontainers/docker)",
    "slow: Slow tests that should be run less frequently",
]
filterwarnings = [
    "ignore:app_settings.USERNAME_REQUIRED is deprecated:UserWarning",
    "ignore:app_settings.EMAIL_REQUIRED is deprecated:UserWarning",
]

# ==================================================
# COVERAGE
# ==================================================
[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["**/tests/*", "**/__init__.py", "**/migrations/*"]

[tool.coverage.report]
fail_under = 20
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
